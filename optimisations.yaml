attempted_optimizations:
  - commit: 14da9aa9bc
    optimization: Skip Silver AST idempotency check
    result: improved
    note: Largest gain observed; likely removes expensive silverProgram toString + reparse + AST compare path.

  - commit: 11af5c77cc
    optimization: Avoid exception-driven coercion fallback by using Either and iterative firstOk flow
    result: improved_slightly
    note: Modest improvement relative to previous commit.

  - commit: working_tree_experiment
    optimization: Reuse LangTypesToCol/LangSpecificToCol instances and minor allocation reductions in Resolution.run
    result: regressed_reverted
    note: 4-run average was 14.430s for the benchmark command, worse than the earlier 11.336s reference on 11af5c77cc; experiment was reverted.

  - commit: working_tree_experiment
    optimization: Forall rewrite structural-sharing fast path (reuse unchanged node/trigger trees)
    result: improved
    note: Correctness check passed and 4-run average became 10.875s (runs: 11.247, 10.778, 10.294, 11.179), about 4.07% faster than the earlier 11.336s reference.

not_worked_out:
  - Name Resolution micro-optimization that reused rewriter instances did not improve runtime and was reverted.


pprof_best_practices:
  - "Read both flat and cumulative views: use flat% for direct optimization targets and cum% to locate expensive subtrees."
  - "Use focused filtering (focus/ignore/show/hide) to reduce noise and isolate one subsystem at a time."
  - "Prefer iterative optimization: change one hotspot, then reprofile and compare against a baseline profile using diff_base/base and normalize when needed."
  - "Use source-level inspection (list/weblist) for the hottest entries to convert profile labels into concrete code edits."
  - "Keep profile capture conditions consistent between runs so differences are attributable to code changes, not environment variance."

pprof_interpretation_notes:
  - "Current profile is stage/tag-heavy (no main binary symbols available), so optimization should target expensive pipeline stages first."
  - "Transformation dominates cumulative time (47.47%), suggesting broad downstream cost; simplify has large cum% but low flat%, so inspect its callees."
  - "Name Resolution and Check are both high flat% and likely to yield direct speedups with lower risk than broad algorithmic changes."
  - "opencl_vector_add.cl being the largest flat hotspot indicates benchmark-specific expression/permission expansion is a prime target."

next_optimization_candidates:
  - rank: 1
    target: Name Resolution
    reason: "High flat share (10.49%) and likely repeated symbol lookups."
    suggested_action: "Memoize repeated lookups/resolutions scoped to a single file pass and avoid repeated recomputation in hot loops."
    expected_impact: medium
    risk: low

  - rank: 2
    target: Check
    reason: "High direct cost (8.55% flat) and isolated stage boundary."
    suggested_action: "Skip or short-circuit redundant checks under --dev-unsafe-optimization where semantic guarantees are unchanged."
    expected_impact: medium
    risk: medium

  - rank: 3
    target: Transformation subtree
    reason: "Largest cumulative cost (47.47% cum)."
    suggested_action: "Use focused pprof runs around simplify / transformation rules and cache intermediate normalized forms for repeated expressions."
    expected_impact: high
    risk: medium


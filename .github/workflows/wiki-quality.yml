name: Wiki Quality Checks

on:
  gollum:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  wiki-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Clone wiki repository
        run: |
          git clone "https://github.com/${{ github.repository }}.wiki.git" wiki
          echo "Cloned wiki commit: $(git -C wiki rev-parse --short HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install markdown and spelling tools
        run: npm install --global markdownlint-cli2 cspell

      - name: Install grammar tool
        run: python -m pip install --upgrade pip proselint

      - name: Markdown lint (includes fenced code language check)
        id: markdownlint
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/wiki-quality-logs"
          markdown_log="$RUNNER_TEMP/wiki-quality-logs/markdownlint.log"
          echo "::add-matcher::.github/wiki-quality/markdownlint-matcher.json"
          set +e
          markdownlint-cli2 --config .github/wiki-quality/.markdownlint.yml "wiki/**/*.md" 2>&1 | tee "$markdown_log"
          status=${PIPESTATUS[0]}
          set -e
          echo "::remove-matcher owner=wiki-markdownlint::"
          exit "$status"

      - name: Spelling check
        id: spelling
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/wiki-quality-logs"
          spelling_log="$RUNNER_TEMP/wiki-quality-logs/cspell.log"
          echo "::add-matcher::.github/wiki-quality/cspell-matcher.json"
          set +e
          cspell lint --config .github/wiki-quality/cspell.json "wiki/**/*.md" 2>&1 | tee "$spelling_log"
          status=${PIPESTATUS[0]}
          set -e
          echo "::remove-matcher owner=wiki-cspell::"
          exit "$status"

      - name: Grammar/style check
        id: grammar
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/wiki-quality-logs"
          grammar_log="$RUNNER_TEMP/wiki-quality-logs/proselint.log"
          echo "::add-matcher::.github/wiki-quality/proselint-matcher.json"
          set +e
          python3 .github/wiki-quality/run_proselint_on_markdown.py \
            --input-dir wiki \
            --proselint-config .github/wiki-quality/proselint.json \
            --path-prefix /wiki 2>&1 | tee "$grammar_log"
          status=${PIPESTATUS[0]}
          set -e
          echo "::remove-matcher owner=wiki-proselint::"
          exit "$status"

      - name: Build result summary
        if: always()
        id: status
        env:
          MARKDOWN_OUTCOME: ${{ steps.markdownlint.outcome }}
          SPELLING_OUTCOME: ${{ steps.spelling.outcome }}
          GRAMMAR_OUTCOME: ${{ steps.grammar.outcome }}
          LOG_DIR: ${{ runner.temp }}/wiki-quality-logs
        run: |
          set -euo pipefail
          overall="success"
          if [[ "$MARKDOWN_OUTCOME" != "success" || "$SPELLING_OUTCOME" != "success" || "$GRAMMAR_OUTCOME" != "success" ]]; then
            overall="failure"
          fi

          {
            echo "# Wiki quality checks"
            echo ""
            echo "- Markdown lint: $MARKDOWN_OUTCOME"
            echo "- Spelling: $SPELLING_OUTCOME"
            echo "- Grammar/style: $GRAMMAR_OUTCOME"
            echo ""
            echo "Tip: you can often auto-fix markdown issues locally with markdownlint-cli2-fix."
            echo "Install: npm install --global markdownlint-cli2"
            echo "Run: markdownlint-cli2-fix --config .github/wiki-quality/.markdownlint.yml \"**/*.md\""
            echo ""
            echo "Triggered by: @${{ github.event.sender.login }}"
            echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

          append_log_details() {
            title="$1"
            outcome="$2"
            file="$3"

            {
              echo ""
              echo "<details>"
              echo "<summary>${title} (outcome: ${outcome})</summary>"
              echo ""
              echo '```text'
              if [[ -f "$file" ]]; then
                cat "$file"
              else
                echo "(no log output captured)"
              fi
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          append_log_details "Markdown lint logs" "$MARKDOWN_OUTCOME" "$LOG_DIR/markdownlint.log"
          append_log_details "Spelling check logs" "$SPELLING_OUTCOME" "$LOG_DIR/cspell.log"
          append_log_details "Grammar/style logs" "$GRAMMAR_OUTCOME" "$LOG_DIR/proselint.log"

          echo "overall=$overall" >> "$GITHUB_OUTPUT"


      - name: Fail workflow when any check failed
        if: always() && steps.status.outputs.overall != 'success'
        run: |
          echo "One or more wiki quality checks failed."
          exit 1

name: Wiki Quality Checks

on:
  gollum:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  wiki-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Clone wiki repository
        run: |
          git clone "https://github.com/${{ github.repository }}.wiki.git" wiki
          echo "Cloned wiki commit: $(git -C wiki rev-parse --short HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install markdown and spelling tools
        run: npm install --global markdownlint-cli2 cspell

      - name: Install grammar tool
        run: python -m pip install --upgrade pip proselint

      - name: Markdown lint (includes fenced code language check)
        id: markdownlint
        continue-on-error: true
        run: markdownlint-cli2 --config .github/wiki-quality/.markdownlint.yml "wiki/**/*.md"

      - name: Spelling check
        id: spelling
        continue-on-error: true
        run: cspell lint --config .github/wiki-quality/cspell.json "wiki/**/*.md"

      - name: Grammar/style check
        id: grammar
        continue-on-error: true
        run: |
          python3 .github/wiki-quality/run_proselint_on_markdown.py \
            --input-dir wiki \
            --proselint-config .github/wiki-quality/proselint.json \
            --path-prefix /wiki

      - name: Build result summary
        if: always()
        id: status
        env:
          MARKDOWN_OUTCOME: ${{ steps.markdownlint.outcome }}
          SPELLING_OUTCOME: ${{ steps.spelling.outcome }}
          GRAMMAR_OUTCOME: ${{ steps.grammar.outcome }}
        run: |
          set -euo pipefail
          overall="success"
          if [[ "$MARKDOWN_OUTCOME" != "success" || "$SPELLING_OUTCOME" != "success" || "$GRAMMAR_OUTCOME" != "success" ]]; then
            overall="failure"
          fi

          {
            echo "# Wiki quality checks"
            echo ""
            echo "- Markdown lint: $MARKDOWN_OUTCOME"
            echo "- Spelling: $SPELLING_OUTCOME"
            echo "- Grammar/style: $GRAMMAR_OUTCOME"
            echo ""
            echo "Tip: you can often auto-fix markdown issues locally with markdownlint-cli2-fix."
            echo "Install: npm install --global markdownlint-cli2"
            echo "Run: markdownlint-cli2-fix --config .github/wiki-quality/.markdownlint.yml \"**/*.md\""
            echo ""
            echo "Triggered by: @${{ github.event.sender.login }}"
            echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "overall=$overall" >> "$GITHUB_OUTPUT"

      - name: Notify editor in issue comment
        if: always()
        uses: actions/github-script@v7
        env:
          OVERALL: ${{ steps.status.outputs.overall }}
          MARKDOWN_OUTCOME: ${{ steps.markdownlint.outcome }}
          SPELLING_OUTCOME: ${{ steps.spelling.outcome }}
          GRAMMAR_OUTCOME: ${{ steps.grammar.outcome }}
        with:
          script: |
            const sender = context.payload?.sender?.login || context.actor;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Wiki quality bot feedback";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `@${sender} wiki quality checks finished with status: **${process.env.OVERALL}**.`,
              "",
              `- Markdown lint: ${process.env.MARKDOWN_OUTCOME}`,
              `- Spelling: ${process.env.SPELLING_OUTCOME}`,
              `- Grammar/style: ${process.env.GRAMMAR_OUTCOME}`,
              "",
              "Tip: some markdown issues can be fixed automatically.",
              "Install: npm install --global markdownlint-cli2",
              "Run: markdownlint-cli2-fix --config .github/wiki-quality/.markdownlint.yml \"**/*.md\"",
              "",
              `Details: ${runUrl}`
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "wiki-feedback",
              per_page: 10
            });

            let issue = issues.find(i => i.title === title);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: "Automated wiki quality feedback will be posted in this issue.",
                labels: ["wiki-feedback"]
              });
              issue = created.data;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body
            });

      - name: Fail workflow when any check failed
        if: always() && steps.status.outputs.overall != 'success'
        run: |
          echo "One or more wiki quality checks failed."
          exit 1

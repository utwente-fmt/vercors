name: Wiki Case Compatibility

on:
  gollum:
  workflow_dispatch:
    inputs:
      release_repository:
        description: Repository containing release assets (<owner>/<repo>)
        required: false
        default: "utwente-fmt/vercors"
      release_version:
        description: Release version to compare against (used by online VerCors)
        required: false
        default: "2.3.0"
      timeout_seconds:
        description: Timeout per case in seconds
        required: false
        default: "60"
  push:
    branches:
      - 'dev'
    paths:
      - .github/workflows/wiki-case-compat.yml
      - util/wiki/**
      - src/**
  pull_request:
    branches:
      - '**'
    paths:
      - .github/workflows/wiki-case-compat.yml
      - util/wiki/**
      - src/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-cases:
    runs-on: ubuntu-24.04
    env:
      TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '60' }}
    steps:
      - name: Checkout VerCors repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc xz-utils curl

      - name: Install Python dependencies for wiki tooling
        working-directory: util/wiki
        run: |
          python3 -m venv .venv-test
          .venv-test/bin/pip install --upgrade pip
          .venv-test/bin/pip install -r requirements.txt pyyaml

      - name: Clone wiki and extract test cases
        working-directory: util/wiki
        run: |
          git clone https://github.com/utwente-fmt/vercors.wiki.git
          .venv-test/bin/python3 ./generate_wiki_pdf.py -i vercors.wiki -c cases

      - name: Upload extracted wiki cases
        uses: actions/upload-artifact@v7
        with:
          name: wiki-cases
          path: util/wiki/cases

  resolve-dev-vercors:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VerCors repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Reuse ScalaTest compilation cache
        uses: actions/cache@v6
        with:
          path: out
          key: vercors-ci-ubuntu-${{ hashFiles('build.sc') }}-${{ hashFiles('src') }}
          restore-keys: |
            vercors-ci-ubuntu-${{ hashFiles('build.sc') }}
            vercors-ci-ubuntu

      - name: Reuse dev deb package cache
        id: cache-dev-deb
        uses: actions/cache@v6
        with:
          path: out/vercors/main/deb.dest
          key: vercors-dev-deb-ubuntu-${{ hashFiles('build.sc') }}-${{ hashFiles('src') }}
          restore-keys: |
            vercors-dev-deb-ubuntu-${{ hashFiles('build.sc') }}
            vercors-dev-deb-ubuntu

      - name: Enable Pallas compilation
        run: touch .include-pallas

      - name: Build latest dev VerCors deb package
        if: steps.cache-dev-deb.outputs.cache-hit != 'true'
        run: ./mill -j 0 vercors.main.deb

      - name: Upload latest dev VerCors deb package
        uses: actions/upload-artifact@v7
        with:
          name: vercors-dev-deb
          path: out/vercors/main/deb.dest/*.deb

  resolve-release-vercors:
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ github.event.inputs.release_version || '2.3.0' }}
      RELEASE_REPOSITORY: ${{ github.event.inputs.release_repository || 'utwente-fmt/vercors' }}
    steps:
      - name: Download release VerCors deb package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/vercors-release-deb"

          release_api_url="https://api.github.com/repos/${RELEASE_REPOSITORY}/releases/tags/v${RELEASE_VERSION}"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$release_api_url" > "$RUNNER_TEMP/release.json"

          asset_url="$(python3 -c 'import json,sys; release=json.load(open(sys.argv[1], "r")); assets=release.get("assets", []); selected=next((a for a in assets if a.get("name", "").lower().endswith(".deb")), None); print(selected["browser_download_url"]) if selected else (_ for _ in ()).throw(SystemExit("Could not find a .deb release asset."))' "$RUNNER_TEMP/release.json")"

          curl -fL "$asset_url" -o "$RUNNER_TEMP/vercors-release-deb/release.deb"

      - name: Upload release VerCors deb package
        uses: actions/upload-artifact@v7
        with:
          name: vercors-release-deb
          path: ${{ runner.temp }}/vercors-release-deb/*.deb

  run-dev-cases:
    runs-on: ubuntu-24.04
    needs: [prepare-cases, resolve-dev-vercors]
    env:
      TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '60' }}
    steps:
      - name: Checkout VerCors repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Install Python dependency for YAML reports
        run: python3 -m pip install --upgrade pip pyyaml

      - name: Download extracted wiki cases
        uses: actions/download-artifact@v8
        with:
          name: wiki-cases
          path: util/wiki/cases

      - name: Download latest dev VerCors deb package
        uses: actions/download-artifact@v8
        with:
          name: vercors-dev-deb
          path: ${{ runner.temp }}/vercors-dev-deb

      - name: Install latest dev VerCors deb package
        run: |
          set -euo pipefail
          deb_file="$(find "$RUNNER_TEMP/vercors-dev-deb" -type f -name '*.deb' | head -n 1)"
          if [[ -z "$deb_file" ]]; then
            echo "Unable to locate downloaded dev .deb package." >&2
            exit 1
          fi
          if ! sudo dpkg -i "$deb_file"; then
            sudo apt-get update
            sudo apt-get install -f -y
            sudo dpkg -i "$deb_file"
          fi

      - name: Run wiki test cases on latest dev VerCors
        run: |
          repo_root="$GITHUB_WORKSPACE"
          dev_vct="$(command -v vct || true)"
          if [[ -z "$dev_vct" ]]; then
            dev_vct="$(command -v vercors || true)"
          fi

          if [[ -z "$dev_vct" ]]; then
            echo "Unable to locate dev vct binary." >&2
            exit 1
          fi

          mkdir -p "$repo_root/tmp"

          python3 "$repo_root/util/wiki/run_wiki_case_report.py" \
            --cases-dir "$repo_root/util/wiki/cases" \
            --output "$repo_root/tmp/wiki_case_report_dev.yaml" \
            --vercors-bin "$dev_vct" \
            --timeout-seconds "$TIMEOUT_SECONDS"

      - name: Upload dev wiki case report
        uses: actions/upload-artifact@v7
        with:
          name: wiki-case-report-dev
          path: tmp/wiki_case_report_dev.yaml

  run-release-cases:
    runs-on: ubuntu-24.04
    needs: [prepare-cases, resolve-release-vercors]
    env:
      TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '60' }}
    steps:
      - name: Checkout VerCors repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Install Python dependency for YAML reports
        run: python3 -m pip install --upgrade pip pyyaml

      - name: Download extracted wiki cases
        uses: actions/download-artifact@v8
        with:
          name: wiki-cases
          path: util/wiki/cases

      - name: Download release VerCors deb package
        uses: actions/download-artifact@v8
        with:
          name: vercors-release-deb
          path: ${{ runner.temp }}/vercors-release-deb

      - name: Install release VerCors deb package
        run: |
          set -euo pipefail
          deb_file="$(find "$RUNNER_TEMP/vercors-release-deb" -type f -name '*.deb' | head -n 1)"
          if [[ -z "$deb_file" ]]; then
            echo "Unable to locate downloaded release .deb package." >&2
            exit 1
          fi
          if ! sudo dpkg -i "$deb_file"; then
            sudo apt-get update
            sudo apt-get install -f -y
            sudo dpkg -i "$deb_file"
          fi

      - name: Run wiki test cases on release VerCors
        run: |
          repo_root="$GITHUB_WORKSPACE"
          release_vct="$(command -v vct || true)"
          if [[ -z "$release_vct" ]]; then
            release_vct="$(command -v vercors || true)"
          fi

          if [[ -z "$release_vct" ]]; then
            echo "Unable to locate release vct binary." >&2
            exit 1
          fi

          mkdir -p "$repo_root/tmp"

          python3 "$repo_root/util/wiki/run_wiki_case_report.py" \
            --cases-dir "$repo_root/util/wiki/cases" \
            --output "$repo_root/tmp/wiki_case_report_release.yaml" \
            --vercors-bin "$release_vct" \
            --timeout-seconds "$TIMEOUT_SECONDS"

      - name: Upload release wiki case report
        uses: actions/upload-artifact@v7
        with:
          name: wiki-case-report-release
          path: tmp/wiki_case_report_release.yaml

  validate-compat:
    runs-on: ubuntu-24.04
    needs: [prepare-cases, run-dev-cases, run-release-cases]
    env:
      RELEASE_VERSION: ${{ github.event.inputs.release_version || '2.3.0' }}
      RELEASE_REPOSITORY: ${{ github.event.inputs.release_repository || 'utwente-fmt/vercors' }}
    steps:
      - name: Checkout VerCors repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependency for YAML reports
        run: python3 -m pip install --upgrade pip pyyaml

      - name: Download extracted wiki cases
        uses: actions/download-artifact@v8
        with:
          name: wiki-cases
          path: util/wiki/cases

      - name: Download dev wiki case report
        uses: actions/download-artifact@v8
        with:
          name: wiki-case-report-dev
          path: tmp

      - name: Download release wiki case report
        uses: actions/download-artifact@v8
        with:
          name: wiki-case-report-release
          path: tmp

      - name: Validate compatibility rules
        run: |
          python3 util/wiki/validate_wiki_case_compat.py \
            --manifest util/wiki/cases/cases-manifest.json \
            --dev-report tmp/wiki_case_report_dev.yaml \
            --release-report tmp/wiki_case_report_release.yaml \
            --release-version "$RELEASE_VERSION" \
            --summary-path tmp/wiki_case_compat_summary.md

      - name: Add release source to summary
        if: always()
        run: |
          {
            echo ""
            echo "Release source repository: $RELEASE_REPOSITORY"
            echo "Release version: $RELEASE_VERSION"
          } >> tmp/wiki_case_compat_summary.md

      - name: Append summary to workflow report
        if: always()
        run: |
          cat tmp/wiki_case_compat_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wiki case reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiki-case-compat-reports
          path: |
            util/wiki/cases/cases-manifest.json
            tmp/wiki_case_report_dev.yaml
            tmp/wiki_case_report_release.yaml
            tmp/wiki_case_compat_summary.md
